<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>補充資料 - 伴程 WithU</title>
<style>
  :root {
    --teal: #2F6F6A;
    --teal-light: #E1EDEB;
    --cta: #E8875B;
    --sand: #FBF8F3;
    --dark: #2B2B2B;
    --muted: #6E6E6A;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    background: var(--sand);
    padding: 32px 20px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  .brand { font-size: 14px; font-weight: 700; color: var(--teal); letter-spacing: 1px; }
  h1 { color: var(--dark); font-size: 26px; margin: 6px 0 4px; }
  .lead { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
  .req-note { font-size: 13px; color: var(--muted); margin: -12px 0 16px; }
  .section {
    background: #fff; border-radius: 14px; padding: 22px;
    margin-bottom: 16px; box-shadow: 0 2px 10px rgba(60,40,30,0.06);
    overflow-wrap: break-word;
  }
  .field { margin-bottom: 18px; }
  .field:last-child { margin-bottom: 0; }
  label, .label { display:block; font-size: 14px; color: var(--dark); font-weight: 600; margin-bottom: 8px; }
  .hint { font-weight: 400; color: var(--muted); font-size: 12px; }
  input[type=text], textarea {
    width: 100%; padding: 10px 12px; border: 1px solid #ECE6DC; border-radius: 8px;
    font-size: 15px; font-family: inherit; color: var(--dark); background: #fff;
  }
  textarea { resize: vertical; min-height: 70px; }
  .chip-group { display:flex; gap: 10px; flex-wrap: wrap; }
  .chip {
    border: 1px solid #ECE6DC; border-radius: 20px; padding: 8px 15px;
    font-size: 14px; cursor: pointer; color: var(--muted); background: #fff;
    user-select: none;
  }
  .chip.selected { background: var(--teal); color: #fff; border-color: var(--teal); }
  .check { display:flex; align-items:center; gap: 8px; margin-top: 10px; font-size: 14px; color: var(--dark); cursor: pointer; }
  .check input { width: 18px; height: 18px; accent-color: var(--teal); }
  .req { color: #C0502A; margin-left: 2px; }
  .field.error input[type=text], .field.error textarea { border-color: #C0502A; background: #FFF6F2; }
  .field.error .chip { border-color: #E9A88D; }
  .err-msg { font-size: 13px; color: #A14A22; margin-top: 6px; font-weight: 600; }
  .submit-btn {
    width: 100%; background: var(--cta); color: var(--dark); border: none; border-radius: 10px;
    padding: 15px; font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit; margin-top: 8px;
  }
  .submit-btn:hover { background: #F09A72; }
  .submit-error {
    display: none; background: #FFF6F2; border: 1px solid #F3C9B3; color: #A14A22;
    border-radius: 10px; padding: 10px 12px; font-size: 14px; font-weight: 600; margin-top: 10px; text-align: center;
  }
  .disclaimer { font-size: 12px; color: var(--muted); text-align:center; margin-top: 14px; line-height: 1.6; }
  .hidden { display: none; }
</style>
</head>
<body>

<div class="wrap">
  <div class="brand">伴程 WithU</div>
  <h1>補充資料</h1>
  <div class="lead">謝謝您刊登需求！再補充幾項資料，我們就能為長輩安排最合適的陪送員，大約 1 分鐘就能完成。</div>
  <div class="req-note">標示 <span class="req">*</span> 的欄位為必填</div>

  <form id="infoForm" novalidate>
    <div class="section">
      <div class="field" id="f-register">
        <div class="label">是否已經掛號<span class="req">*</span></div>
        <div class="chip-group" data-group="register">
          <span class="chip" data-value="已掛號">已掛號</span>
          <span class="chip" data-value="還沒掛號">還沒掛號</span>
          <span class="chip" data-value="不需要（不是看診）">不需要（不是看診）</span>
        </div>
      </div>

      <div class="field" id="f-dept">
        <label for="dept">看診科別<span class="req">*</span> <span class="hint">例如：心臟內科、復健科</span></label>
        <input type="text" id="dept" placeholder="請填寫科別">
      </div>

      <div class="field" id="f-name">
        <label for="elderName">長輩希望我們怎麼稱呼他<span class="req">*</span></label>
        <input type="text" id="elderName" placeholder="例如：陳奶奶、王伯伯">
      </div>

      <div class="field" id="f-lang">
        <div class="label">長輩平常習慣說的語言<span class="req">*</span> <span class="hint">可以複選</span></div>
        <div class="chip-group multi" data-group="lang">
          <span class="chip" data-value="國語">國語</span>
          <span class="chip" data-value="台語">台語</span>
          <span class="chip" data-value="客語">客語</span>
          <span class="chip" data-value="其他">其他</span>
        </div>
      </div>

      <div class="field" id="f-habit">
        <label for="habit">需要特別注意的習慣<span class="req">*</span></label>
        <textarea id="habit" placeholder="例如：容易緊張、走路要扶、怕吵、聽力不好要大聲說話"></textarea>
        <label class="check"><input type="checkbox" id="noHabit">沒有特別需要注意的</label>
      </div>
    </div>

    <button type="submit" class="submit-btn">送出補充資料</button>
    <div class="submit-error" id="submitError"></div>
    <div class="disclaimer">
      按下送出後會開啟 LINE，請在 LINE 裡按「傳送」，我們才會收到。<br>
      資料只用於安排陪同服務，不會提供給第三方。
    </div>
  </form>
</div>

<script>
  const LINE_OA_ID = "@370cwhmh";
  const $ = id => document.getElementById(id);
  const charCount = s => [...s.replace(/\s/g, "")].length;

  // 單選與複選晶片
  document.querySelectorAll(".chip-group").forEach(group => {
    const multi = group.classList.contains("multi");
    group.querySelectorAll(".chip").forEach(chip => chip.addEventListener("click", () => {
      if (multi) chip.classList.toggle("selected");
      else {
        group.querySelectorAll(".chip").forEach(c => c.classList.remove("selected"));
        chip.classList.add("selected");
      }
      onChange();
    }));
  });

  const selected = name => [...document.querySelectorAll(`[data-group="${name}"] .chip.selected`)].map(c => c.dataset.value);
  const notClinic = () => selected("register")[0] === "不需要（不是看診）";

  // 不是看診就不用填科別
  function syncDept() { $("f-dept").classList.toggle("hidden", notClinic()); }

  // 勾選「沒有特別需要注意的」就不用填習慣
  $("noHabit").addEventListener("change", () => {
    $("habit").disabled = $("noHabit").checked;
    if ($("noHabit").checked) $("habit").value = "";
    onChange();
  });

  // 每個欄位的檢查：回傳錯誤訊息，沒問題回傳空字串（順序與頁面一致）
  const RULES = [
    ["f-register", () => selected("register").length ? "" : "請選擇是否已經掛號"],
    ["f-dept", () => notClinic() || charCount($("dept").value) >= 2 ? "" : "請填寫看診科別"],
    ["f-name", () => charCount($("elderName").value) >= 2 ? "" : "請填寫長輩的稱呼（例如：陳奶奶）"],
    ["f-lang", () => selected("lang").length ? "" : "請至少選擇一種語言"],
    ["f-habit", () => $("noHabit").checked || charCount($("habit").value) >= 2 ? "" : "請填寫需要注意的習慣，或勾選「沒有特別需要注意的」"],
  ];

  function showError(fieldId, msg) {
    const field = $(fieldId);
    let el = field.querySelector(".err-msg");
    field.classList.toggle("error", !!msg);
    if (!msg) { if (el) el.remove(); return; }
    if (!el) { el = document.createElement("div"); el.className = "err-msg"; field.appendChild(el); }
    el.textContent = msg;
  }

  function validate() {
    let first = null, count = 0;
    for (const [id, check] of RULES) {
      const msg = check();
      showError(id, msg);
      if (msg) { count++; if (!first) first = id; }
    }
    $("submitError").style.display = count ? "block" : "none";
    $("submitError").textContent = count ? `還有 ${count} 個欄位需要填寫，請看上方紅色提示` : "";
    if (first) $(first).scrollIntoView({ behavior: "smooth", block: "center" });
    return count === 0;
  }

  // 已經顯示錯誤的欄位，修正後即時拿掉提示
  function onChange() {
    syncDept();
    for (const [id, check] of RULES) if ($(id).classList.contains("error")) showError(id, check());
  }
  ["dept", "elderName", "habit"].forEach(id => $(id).addEventListener("input", onChange));

  const oneLine = s => s.trim().replace(/\s*\n+\s*/g, "；");

  $("infoForm").addEventListener("submit", e => {
    e.preventDefault();
    if (!validate()) return;
    // 第一行固定是「補充資料」，LINE 自動回覆程式靠這個辨認並寫進試算表
    const summary =
      "補充資料：\n" +
      `掛號：${selected("register")[0]}\n` +
      `科別：${notClinic() ? "不需要" : oneLine($("dept").value)}\n` +
      `稱呼：${oneLine($("elderName").value)}\n` +
      `語言：${selected("lang").join("、")}\n` +
      `注意事項：${$("noHabit").checked ? "沒有特別需要注意的" : oneLine($("habit").value)}`;
    window.open(`https://line.me/R/oaMessage/${LINE_OA_ID}/?${encodeURIComponent(summary)}`, "_blank");
  });

  syncDept();
</script>
</body>
</html>
