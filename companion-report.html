<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>陪送員當天回報 - 伴程 WithU</title>
<style>
  :root {
    --teal: #2F6F6A;
    --teal-light: #E1EDEB;
    --cta: #E8875B;
    --sand: #FBF8F3;
    --dark: #2B2B2B;
    --muted: #6E6E6A;
    --red: #C0392B;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    background: var(--sand); color: var(--dark);
    padding: 24px 16px 40px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  .brand { font-size: 14px; font-weight: 700; color: var(--teal); letter-spacing: 1px; }
  h1 { font-size: 24px; margin: 4px 0 4px; }
  .lead { color: var(--muted); font-size: 14px; margin-bottom: 16px; line-height: 1.6; }
  .card {
    background: #fff; border-radius: 14px; padding: 16px 18px; margin-bottom: 14px;
    box-shadow: 0 2px 10px rgba(60,40,30,0.06);
  }
  .card h2 { font-size: 15px; color: var(--teal); margin-bottom: 10px; }
  .info { display: grid; grid-template-columns: 76px 1fr; gap: 8px 10px; align-items: center; font-size: 14px; }
  .info label { color: var(--muted); }
  input[type=text], textarea {
    width: 100%; padding: 9px 11px; border: 1px solid #ECE6DC; border-radius: 8px;
    font-size: 15px; font-family: inherit; color: var(--dark); background: #fff;
  }
  textarea { resize: vertical; min-height: 56px; }
  .tip { font-size: 13px; color: var(--muted); background: var(--teal-light); border-radius: 10px; padding: 10px 12px; margin-bottom: 14px; line-height: 1.6; }
  .step { border: 1px solid #ECE6DC; border-radius: 14px; background: #fff; margin-bottom: 10px; overflow: hidden; }
  .step > button {
    width: 100%; text-align: left; background: #fff; border: none; padding: 15px 16px;
    font-size: 17px; font-weight: 700; font-family: inherit; color: var(--dark); cursor: pointer;
    display: flex; justify-content: space-between; align-items: center;
  }
  .step > button .sub { font-size: 12px; font-weight: 400; color: var(--muted); }
  .step.done > button { background: #F3F8F7; }
  .step.done > button::after { content: "已傳 ✓"; font-size: 12px; color: var(--teal); font-weight: 700; }
  .step.danger > button { color: var(--red); }
  .panel { display: none; padding: 0 16px 16px; }
  .step.open .panel { display: block; }
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
  .field .hint { font-weight: 400; color: var(--muted); }
  .preview { white-space: pre-wrap; font-size: 14px; background: var(--sand); border-radius: 10px; padding: 10px 12px; margin: 6px 0 10px; line-height: 1.6; }
  .send {
    width: 100%; background: var(--cta); color: var(--dark); border: none; border-radius: 10px;
    padding: 13px; font-size: 16px; font-weight: 700; font-family: inherit; cursor: pointer;
  }
  .call119 {
    display: block; text-align: center; background: var(--red); color: #fff; text-decoration: none;
    border-radius: 10px; padding: 13px; font-size: 17px; font-weight: 700; margin-bottom: 10px;
  }
  .link-btn { display: inline-block; margin-bottom: 10px; color: var(--teal); font-weight: 700; font-size: 14px; }
  .photo { font-size: 13px; color: #8A4426; font-weight: 600; margin-bottom: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">伴程 WithU｜陪送員專用</div>
  <h1>當天回報</h1>
  <div class="lead">按下要回報的項目，確認訊息後按「傳到群組」，LINE 會打開分享畫面，<b>選擇這次服務的群組</b>就能送出。</div>

  <div class="card">
    <h2>這次服務的資訊</h2>
    <div class="info">
      <label for="elder">長輩稱呼</label><input type="text" id="elder" placeholder="例如：陳奶奶">
      <label for="cname">陪送員</label><input type="text" id="cname" placeholder="例如：林">
      <label for="when">時間</label><input type="text" id="when" placeholder="例如：10/24（六）14:00">
      <label for="from">碰面地點</label><input type="text" id="from" placeholder="長輩家地址">
      <label for="dest">目的地</label><input type="text" id="dest" placeholder="例如：萬芳醫院 心臟內科">
    </div>
  </div>

  <div class="tip">📸 標示「附照片」的項目，在 LINE 選好群組送出文字後，<b>記得再拍一張照片傳到群組</b>，讓家屬安心。</div>

  <div id="steps"></div>
</div>

<script>
  const $ = id => document.getElementById(id);
  const q = new URLSearchParams(location.search);
  // 服務資訊由試算表產生的連結帶入：?e=長輩稱呼&n=陪送員&t=時間&f=碰面地點&d=目的地
  [["elder", "e"], ["cname", "n"], ["when", "t"], ["from", "f"], ["dest", "d"]].forEach(([id, key]) => { $(id).value = q.get(key) || ""; });

  const v = id => $(id).value.trim();
  const elder = () => v("elder") || "長輩";
  const me = () => v("cname") ? "陪送員" + v("cname") : "陪送員";
  const dest = () => v("dest") || "目的地";
  const opt = (label, text) => text ? `\n${label}${text}` : "";

  // 每個回報項目：標題、說明、需要現場填的欄位、訊息內容
  const STEPS = [
    { key: "leave", title: "🚶 準備出發", sub: "出門前", fields: [["eta", "預計幾點到門口", "例如：13:50"]],
      build: f => `您好！我是${me()}，預計 ${f.eta || "【時間】"} 到達門口，到了會再通知您 😊` },
    { key: "pickup", title: "📸 接到長輩了", sub: "附照片", photo: true,
      fields: [["how", "交通方式", "例如：搭 251 號公車、計程車"], ["arrive", "預計幾點到", "例如：14:30"]],
      build: f => `📸 已經接到${elder()}了，準備出發囉！` + opt("🚌 交通方式：", f.how) + `\n🏥 預計 ${f.arrive || "【時間】"} 到達${dest()}。` },
    { key: "location", title: "📍 分享即時位置", sub: "Google 地圖", maps: true,
      fields: [["link", "貼上 Google 地圖的即時位置連結", "Google 地圖 → 點自己的藍點 → 分享位置 → 複製連結"]],
      build: f => `📍 這是我們的即時位置，您可以隨時查看：\n${f.link || "【即時位置連結】"}` },
    { key: "checkin", title: "🏥 已到達並報到", sub: "到醫院後",
      fields: [["now", "目前看診號碼", "例如：12"], ["mine", "我們的號碼", "例如：18"]],
      build: f => `🏥 已經到達${dest()}，完成報到了！` + (f.now || f.mine ? `\n目前看診號碼是 ${f.now || "—"} 號，我們是 ${f.mine || "—"} 號。` : "") + `\n${elder()}正在候診，精神不錯 😊` },
    { key: "done", title: "✅ 看完診了", sub: "附藥袋照片", photo: true, area: true,
      fields: [["notes", "醫生交代的重點", "例如：下次回診 11/5；藥要飯後吃"], ["med", "接下來", "例如：正在領藥"]],
      build: f => `✅ 看完診了！` + (f.notes ? `\n醫生交代的重點：\n・${f.notes.split(/[；;\n]+/).filter(Boolean).join("\n・")}` : "") + `\n💊 ${f.med || "正在領藥"}，結束後就送${elder()}回家。` },
    { key: "home", title: "🏠 平安到家", sub: "附照片", photo: true, fields: [],
      build: () => `🏠 已經平安送${elder()}回到家，也確認他進門了 📸\n今天的陪同到這裡結束，謝謝您的信任！\n晚一點工作人員會跟您收一下這次的回饋 🙏` },
    { key: "late", title: "⏰ 可能會遲到", sub: "臨時狀況",
      fields: [["why", "原因", "例如：公車誤點"], ["mins", "大約晚幾分鐘", "例如：10"]],
      build: f => `非常抱歉 🙏 因為${f.why || "【原因】"}，${me()}預計會晚 ${f.mins || "【幾】"} 分鐘到達。\n到達前會再通知您，請${elder()}先在家裡休息等候，不用到門口等。` },
    { key: "sick", title: "⚠️ 長輩身體不適", sub: "緊急", danger: true, area: true,
      fields: [["where", "在哪裡", "例如：醫院候診區"], ["what", "狀況", "例如：感到頭暈、臉色發白"], ["action", "目前處理", "例如：已撥打 119，救護車約 5 分鐘到"]],
      build: f => `⚠️ 跟您說明目前的狀況：\n${elder()}在${f.where || "【地點】"}時${f.what || "【狀況】"}。\n🚑 目前處理：${f.action || "【處理情形】"}\n我們會持續陪在旁邊，也會隨時跟您更新。` },
  ];

  function render() {
    $("steps").innerHTML = STEPS.map(s => `
      <div class="step${s.danger ? " danger" : ""}" id="step-${s.key}">
        <button type="button" data-toggle="${s.key}">${s.title}<span class="sub">${s.sub}</span></button>
        <div class="panel">
          ${s.danger ? '<a class="call119" href="tel:119">📞 情況緊急請先撥打 119</a>' : ""}
          ${s.maps ? '<a class="link-btn" href="https://www.google.com/maps" target="_blank">開啟 Google 地圖 →</a>' : ""}
          ${s.fields.map(([id, label, hint]) => `
            <div class="field"><label for="${s.key}-${id}">${label} <span class="hint">${hint}</span></label>
            ${s.area && id !== "med" && id !== "where" ? `<textarea id="${s.key}-${id}"></textarea>` : `<input type="text" id="${s.key}-${id}">`}</div>`).join("")}
          <div class="preview" id="preview-${s.key}"></div>
          ${s.photo ? '<div class="photo">📸 送出文字後，記得再傳照片到群組</div>' : ""}
          <button type="button" class="send" data-send="${s.key}">傳到群組</button>
        </div>
      </div>`).join("");
  }

  function values(s) {
    const f = {};
    s.fields.forEach(([id]) => { f[id] = $(`${s.key}-${id}`).value.trim(); });
    return f;
  }
  function refresh(s) { $("preview-" + s.key).textContent = s.build(values(s)); }

  render();
  STEPS.forEach(s => {
    s.fields.forEach(([id]) => $(`${s.key}-${id}`).addEventListener("input", () => refresh(s)));
    refresh(s);
  });
  ["elder", "cname", "when", "from", "dest"].forEach(id => $(id).addEventListener("input", () => STEPS.forEach(refresh)));

  document.addEventListener("click", e => {
    const t = e.target.closest("[data-toggle]");
    if (t) {
      const box = $("step-" + t.dataset.toggle);
      document.querySelectorAll(".step.open").forEach(b => { if (b !== box) b.classList.remove("open"); });
      box.classList.toggle("open");
      return;
    }
    const send = e.target.closest("[data-send]");
    if (send) {
      const s = STEPS.find(x => x.key === send.dataset.send);
      // line.me/R/share 會打開 LINE 的分享畫面，讓陪送員選擇要傳到哪個群組
      window.open("https://line.me/R/share?text=" + encodeURIComponent(s.build(values(s))), "_blank");
      $("step-" + s.key).classList.add("done");
    }
  });
</script>
</body>
</html>
