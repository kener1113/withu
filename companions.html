<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>瀏覽陪送員 - 伴程 WithU</title>
<style>
  :root {
    --teal: #2F6F6A;
    --teal-light: #E1EDEB;
    --cta: #E8875B;
    --sand: #FBF8F3;
    --dark: #2B2B2B;
    --muted: #6E6E6A;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    background: var(--sand);
    padding: 32px 20px;
  }
  .header { max-width: 900px; margin: 0 auto 20px; }
  .brand { font-size: 14px; font-weight: 700; color: var(--teal); letter-spacing: 1px; }
  a.brand { display: inline-block; text-decoration: none; }
  a.brand:hover { text-decoration: underline; }
  h1 { color: var(--dark); font-size: 26px; margin-top: 6px; }
  .lead { color: var(--muted); font-size: 14px; line-height: 1.7; margin-top: 6px; }
  .notice {
    background: #FBE8DE; border: 1px solid #F3C9B3; border-radius: 12px;
    padding: 10px 14px; margin-top: 14px; color: #8A4426; font-size: 13px; line-height: 1.6; display: none;
  }
  .filters { display:flex; gap:10px; margin: 18px 0 6px; flex-wrap: wrap; align-items: center; }
  .filters label { font-size: 13px; color: var(--muted); }
  .filters select {
    background: #fff; border: 1px solid #ECE6DC; border-radius: 20px;
    padding: 7px 12px; font-size: 13px; color: var(--dark); font-family: inherit;
  }
  .fav-toggle {
    background: #fff; border: 1px solid #ECE6DC; border-radius: 20px; padding: 7px 14px;
    font-size: 13px; color: var(--muted); cursor: pointer; font-family: inherit;
  }
  .fav-toggle.on { background: var(--cta); border-color: var(--cta); color: var(--dark); font-weight: 700; }
  .count { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 18px;
    max-width: 900px;
    margin: 0 auto;
  }
  .card {
    background: #fff; border-radius: 14px; padding: 20px;
    box-shadow: 0 2px 10px rgba(60,40,30,0.06);
    position: relative; overflow-wrap: break-word;
    display: flex; flex-direction: column;
  }
  .heart {
    position: absolute; top: 16px; right: 16px; background: none; border: none;
    font-size: 22px; color: #ccc; cursor: pointer; line-height: 1;
  }
  .heart.active { color: var(--cta); }
  .top-row { display:flex; align-items:center; gap:14px; padding-right: 28px; }
  .avatar {
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--teal); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700; flex-shrink: 0;
  }
  .name { font-size: 17px; font-weight: 700; color: var(--dark); }
  .school { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .rating { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .rating b { color: var(--cta); font-size: 15px; }
  .tag {
    display: inline-block; margin-left: 6px; vertical-align: middle;
    font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px;
  }
  .tag.demo { background: #ECE6DC; color: var(--muted); }
  .tag.top { background: #FBE8DE; color: #8A4426; }
  .tag.new { background: var(--teal-light); color: var(--teal); }
  .tag.pending { background: #FFF3D6; color: #8A6A10; }
  .badge.pending { background: #F4F1EC; color: var(--muted); }
  .book-btn.disabled { background: #ECE6DC; color: var(--muted); pointer-events: none; }
  .badges { display:flex; gap:6px; flex-wrap: wrap; margin: 14px 0 10px; }
  .badge {
    background: var(--teal-light); color: var(--teal);
    font-size: 12px; padding: 4px 10px; border-radius: 12px; font-weight: 600;
  }
  .info { font-size: 13px; color: var(--dark); line-height: 1.8; margin-bottom: 10px; }
  .info span { color: var(--muted); }
  .scores { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 8px; align-items: center; font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  .bar { height: 6px; background: #ECE6DC; border-radius: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--teal); }
  .review {
    font-size: 13px; color: var(--muted); background: var(--sand);
    border-radius: 8px; padding: 10px 12px; margin-bottom: 14px; line-height: 1.6;
  }
  .book-btn {
    margin-top: auto; display: block; text-align: center; text-decoration: none;
    background: var(--cta); color: var(--dark); border-radius: 8px;
    padding: 12px; font-size: 15px; font-weight: 700;
  }
  .book-btn:hover { background: #F09A72; }
  .state { max-width: 900px; margin: 30px auto; text-align: center; color: var(--muted); font-size: 15px; line-height: 1.8; }
  .state a { color: var(--teal); font-weight: 700; }
  .skeleton { height: 260px; border-radius: 14px; background: linear-gradient(90deg, #F1ECE4 25%, #F8F4EE 50%, #F1ECE4 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .footer-note { max-width: 900px; margin: 26px auto 0; font-size: 12px; color: var(--muted); text-align: center; line-height: 1.7; }
</style>
</head>
<body>

<div class="header">
  <a class="brand" href="index.html">← 伴程 WithU 官網</a>
  <h1>瀏覽陪送員</h1>
  <div class="lead">以下是伴程 WithU 的大學生陪送員。想指定某位陪送員，按「預約這位陪送員」就能直接刊登需求；不確定的話，也可以交給平台幫您媒合。<br>
  標示「審核中」「培訓中」的陪送員還在認證流程中，完成審核與培訓後才會開放預約。</div>
  <div class="notice" id="demoNotice">試營運期間，部分陪送員為<b>示範資料</b>（標示「示範」），評價為內部測試結果。</div>
  <div class="filters">
    <label>語言 <select id="fLang"><option value="">全部</option></select></label>
    <label>時段 <select id="fSlot"><option value="">全部</option></select></label>
    <label>性別 <select id="fGender"><option value="">不限</option><option>女性</option><option>男性</option></select></label>
    <button class="fav-toggle" id="fFav" type="button">♥ 只看收藏</button>
  </div>
  <div class="count" id="count"></div>
</div>

<div class="grid" id="grid">
  <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
</div>
<div class="state" id="state" hidden></div>

<div class="footer-note">
  為保護陪送員隱私，網站只顯示暱稱與學校；完整資料會在媒合後由平台提供。<br>
  「審核中」「培訓中」的陪送員資料為本人填寫，尚未經平台驗證。<br>
  評分為家屬在每次服務後，依守時、態度、完成度三項指標給的 1–5 分。
</div>

<script>
  // LINE 自動回覆程式的網址：陪送員資料即時從試算表讀取
  const DATA_URL = "https://script.google.com/macros/s/AKfycbzC54nYDO43KkD0BP46HkbMLbRZfyNrpk5K7TO_AG-E0hVA9MTamb9xwVFpc3omVIKyhQ/exec?action=companions";
  const SLOT_ORDER = ["平日上午", "平日下午", "平日晚上", "週末上午", "週末下午", "週末晚上"];
  const $ = id => document.getElementById(id);
  let companions = [];
  let favOnly = false;

  // 收藏只記在這台裝置（瀏覽器關閉或無痕模式時可能讀不到，不影響使用）
  function loadFavs() {
    try { return JSON.parse(localStorage.getItem("withu-favs") || "[]"); } catch (e) { return []; }
  }
  function saveFavs(list) {
    try { localStorage.setItem("withu-favs", JSON.stringify(list)); } catch (e) { /* 存不了就只在這次瀏覽有效 */ }
  }
  let favs = loadFavs();
  const keyOf = c => c.name + "｜" + c.school;

  const esc = s => String(s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));

  function scoreRow(label, v) {
    return `<span>${label}</span><div class="bar"><i style="width:${(v / 5) * 100}%"></i></div><span>${v.toFixed(1)}</span>`;
  }

  const STAGE_TAG = { training: "培訓中", reviewing: "審核中" };

  function card(c) {
    const fav = favs.includes(keyOf(c));
    const ready = c.stage === "accepted";
    const ratingHtml = c.rating
      ? `<div class="rating">⭐ <b>${c.rating.toFixed(1)}</b>（${c.served} 次服務）</div>`
      : ready ? `<div class="rating"><span class="tag new" style="margin-left:0">新加入的陪送員</span></div>` : "";
    // 還沒錄取的人：學生身分與培訓尚未完成，不能顯示成已認證；急救證照是本人填寫，標示待驗證
    const badges = ready
      ? `<span class="badge">✓ 學生身分已驗證</span>${c.firstAid ? '<span class="badge">✓ 急救證照</span>' : ""}<span class="badge">✓ 失智友善培訓</span>`
      : (c.firstAid ? '<span class="badge pending">急救證照（待驗證）</span>' : "");
    const book = "post-request.html?companion=" + encodeURIComponent(`${c.name}（${c.school}）`);
    const button = ready
      ? `<a class="book-btn" href="${book}">預約這位陪送員</a>`
      : `<span class="book-btn disabled">審核完成後開放預約</span>`;
    return `<div class="card">
      <button class="heart ${fav ? "active" : ""}" data-key="${esc(keyOf(c))}" aria-label="收藏">${fav ? "♥" : "♡"}</button>
      <div class="top-row">
        <div class="avatar">${esc(Array.from(c.name)[0] || "?")}</div>
        <div>
          <div class="name">${esc(c.name)}${c.top ? '<span class="tag top">🌟 優質陪送員</span>' : ""}${STAGE_TAG[c.stage] ? `<span class="tag pending">${STAGE_TAG[c.stage]}</span>` : ""}${c.demo ? '<span class="tag demo">示範</span>' : ""}</div>
          <div class="school">${esc(c.school)}</div>
          ${ratingHtml}
        </div>
      </div>
      ${badges ? `<div class="badges">${badges}</div>` : '<div style="height:12px"></div>'}
      <div class="info">
        <span>語言：</span>${esc(c.languages.join("、") || "—")}<br>
        <span>可服務時段：</span>${esc(c.slots.join("、") || "—")}<br>
        <span>陪同方式：</span>陪搭公車、計程車
      </div>
      ${c.rating ? `<div class="scores">${scoreRow("守時", c.scores.punctual)}${scoreRow("態度", c.scores.attitude)}${scoreRow("完成度", c.scores.completion)}</div>` : ""}
      ${c.review ? `<div class="review">💬 家屬評論：「${esc(c.review)}」</div>` : ""}
      ${button}
    </div>`;
  }

  function render() {
    const lang = $("fLang").value, slot = $("fSlot").value, gender = $("fGender").value;
    const list = companions
      .filter(c => !lang || c.languages.includes(lang))
      .filter(c => !slot || c.slots.includes(slot))
      .filter(c => !gender || c.gender === gender)
      .filter(c => !favOnly || favs.includes(keyOf(c)))
      // 已錄取的排前面；其中優質陪送員優先，再依評分高低（高分者優先曝光）
      .sort((a, b) => ((b.stage === "accepted") - (a.stage === "accepted")) || (b.top - a.top) || (b.rating - a.rating) || (b.served - a.served));
    const ready = list.filter(c => c.stage === "accepted").length;
    $("count").textContent = `共 ${list.length} 位陪送員（可預約 ${ready} 位，審核／培訓中 ${list.length - ready} 位）`;
    $("grid").innerHTML = list.map(card).join("");
    $("state").hidden = list.length > 0;
    $("state").innerHTML = favOnly && !favs.length
      ? "還沒有收藏的陪送員，按卡片右上角的 ♡ 就能收藏。"
      : '沒有符合條件的陪送員，換個條件試試，或<a href="post-request.html">直接刊登需求</a>，平台會幫您媒合。';
    document.querySelectorAll(".heart").forEach(h => h.addEventListener("click", () => {
      const k = h.dataset.key;
      favs = favs.includes(k) ? favs.filter(x => x !== k) : favs.concat(k);
      saveFavs(favs);
      render();
    }));
  }

  function fillOptions(select, values) {
    values.forEach(v => { const o = document.createElement("option"); o.textContent = v; select.appendChild(o); });
  }

  ["fLang", "fSlot", "fGender"].forEach(id => $(id).addEventListener("change", render));
  $("fFav").addEventListener("click", () => { favOnly = !favOnly; $("fFav").classList.toggle("on", favOnly); render(); });

  fetch(DATA_URL)
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(data => {
      companions = data.companions || [];
      const langs = [...new Set(companions.flatMap(c => c.languages))];
      const slots = SLOT_ORDER.filter(s => companions.some(c => c.slots.includes(s)));
      fillOptions($("fLang"), langs);
      fillOptions($("fSlot"), slots);
      $("demoNotice").style.display = companions.some(c => c.demo) ? "block" : "none";
      if (!companions.length) {
        $("grid").innerHTML = "";
        $("state").hidden = false;
        $("state").innerHTML = '陪送員正在招募與培訓中，很快就會在這裡和您見面！<br>現在有陪同需求，請<a href="post-request.html">直接刊登</a>，平台會為您媒合。';
        return;
      }
      render();
    })
    .catch(() => {
      $("grid").innerHTML = "";
      $("state").hidden = false;
      $("state").innerHTML = '陪送員資料暫時無法載入，請稍後重新整理。<br>現在有陪同需求，也可以<a href="post-request.html">直接刊登</a>，平台會為您媒合。';
    });
</script>

</body>
</html>
