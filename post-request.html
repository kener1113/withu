<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>刊登需求 - 伴程 WithU</title>
<style>
  :root {
    --teal: #2F6F6A;
    --teal-light: #E1EDEB;
    --cta: #E8875B;
    --sand: #FBF8F3;
    --dark: #2B2B2B;
    --muted: #6E6E6A;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    background: var(--sand);
    padding: 32px 20px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  .brand { font-size: 14px; font-weight: 700; color: var(--teal); letter-spacing: 1px; }
  h1 { color: var(--dark); font-size: 26px; margin: 6px 0 4px; }
  .lead { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
  .section {
    background: #fff; border-radius: 14px; padding: 22px;
    margin-bottom: 16px; box-shadow: 0 2px 10px rgba(60,40,30,0.06);
    overflow-wrap: break-word;
  }
  .section-title {
    font-size: 15px; font-weight: 700; color: var(--teal);
    margin-bottom: 14px; display:flex; align-items:center; gap:8px;
  }
  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }
  label { display:block; font-size: 13px; color: var(--dark); font-weight: 600; margin-bottom: 6px; }
  input[type=text], input[type=date], input[type=time], textarea, select {
    width: 100%; padding: 10px 12px; border: 1px solid #ECE6DC; border-radius: 8px;
    font-size: 14px; font-family: inherit; color: var(--dark); background: #fff;
  }
  textarea { resize: vertical; min-height: 60px; }
  .radio-group { display:flex; gap: 10px; flex-wrap: wrap; }
  .radio-chip {
    border: 1px solid #ECE6DC; border-radius: 20px; padding: 7px 14px;
    font-size: 13px; cursor: pointer; color: var(--muted); background: #fff;
  }
  .radio-chip.selected { background: var(--teal); color: #fff; border-color: var(--teal); }
  .note {
    font-size: 12px; color: var(--muted); margin-top: 6px;
  }
  .submit-btn {
    width: 100%;
    background: var(--cta);
    color: var(--dark);
    border: none;
    border-radius: 10px;
    padding: 15px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    margin-top: 8px;
  }
  .submit-btn:hover { background: #F09A72; }
  .disclaimer {
    font-size: 12px; color: var(--muted); text-align:center; margin-top: 14px; line-height: 1.6;
  }
  .req { color: #C0502A; margin-left: 2px; }
  .req-note { font-size: 13px; color: var(--muted); margin: -12px 0 16px; }
  .field.error input { border-color: #C0502A; background: #FFF6F2; }
  .err-msg { font-size: 13px; color: #A14A22; margin-top: 5px; font-weight: 600; }
  .submit-error {
    display: none; background: #FFF6F2; border: 1px solid #F3C9B3; color: #A14A22;
    border-radius: 10px; padding: 10px 12px; font-size: 14px; font-weight: 600; margin-top: 10px; text-align: center;
  }
  a.brand { display: inline-block; text-decoration: none; }
  a.brand:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="wrap">
  <a class="brand" href="index.html">← 伴程 WithU 官網</a>
  <h1>刊登需求</h1>
  <div class="lead">填好基本資訊，平台會從陪送員中篩選並推薦 1–3 位人選給您。</div>
  <div class="req-note">標示 <span class="req">*</span> 的欄位為必填</div>

  <form id="requestForm" novalidate>

    <div class="section">
      <div class="section-title">長輩資訊</div>
      <div class="field">
        <label>長輩性別<span class="req">*</span></label>
        <div class="radio-group" data-group="elderGender" id="elderGender">
          <span class="radio-chip" data-value="男性">男性</span>
          <span class="radio-chip" data-value="女性">女性</span>
        </div>
      </div>
      <div class="field">
        <label>希望陪送員的性別<span class="req">*</span></label>
        <div class="radio-group" data-group="prefGender" id="prefGender">
          <span class="radio-chip selected" data-value="不限">不限</span>
          <span class="radio-chip" data-value="男性">男性</span>
          <span class="radio-chip" data-value="女性">女性</span>
        </div>
      </div>
      <div class="field">
        <label>行動能力</label>
        <div class="radio-group" data-group="mobility">
          <span class="radio-chip selected" data-value="可自行走動">可自行走動</span>
          <span class="radio-chip" data-value="需攙扶">需攙扶</span>
          <span class="radio-chip" data-value="使用助行器">使用助行器</span>
        </div>
      </div>
      <div class="field">
        <label>是否有失智情形</label>
        <div class="radio-group" data-group="dementia">
          <span class="radio-chip selected" data-value="無">無</span>
          <span class="radio-chip" data-value="輕度">輕度</span>
          <span class="radio-chip" data-value="中重度">中重度</span>
        </div>
      </div>
      <div class="field">
        <label>健康狀況備註（選填）</label>
        <textarea id="healthNote" placeholder="慢性病、過敏、行動限制等需要注意的事項"></textarea>
      </div>
      <div class="field">
        <label>緊急聯絡人電話（服務期間需保持暢通）<span class="req">*</span></label>
        <input type="text" id="emergencyPhone" placeholder="09XX-XXX-XXX">
      </div>
    </div>

    <div class="section">
      <div class="section-title">服務內容</div>
      <div class="field">
        <label>服務類型</label>
        <div class="radio-group" data-group="serviceType">
          <span class="radio-chip selected" data-value="看診">看診</span>
          <span class="radio-chip" data-value="洗腎">洗腎</span>
          <span class="radio-chip" data-value="辦事">辦事</span>
          <span class="radio-chip" data-value="買東西">買東西</span>
          <span class="radio-chip" data-value="其他">其他</span>
        </div>
      </div>
      <div class="field">
        <label>服務日期<span class="req">*</span></label>
        <input type="date" id="serviceDate">
      </div>
      <div class="field">
        <label>服務時間（起）<span class="req">*</span></label>
        <input type="time" id="serviceTime">
      </div>
      <div class="field">
        <label>預估服務時數</label>
        <div class="radio-group" data-group="duration">
          <span class="radio-chip selected" data-value="2小時">2 小時</span>
          <span class="radio-chip" data-value="3小時">3 小時</span>
        </div>
      </div>
      <div class="field">
        <label>出發地點（到府接送地址）<span class="req">*</span></label>
        <input type="text" id="fromAddr" placeholder="例如：文山區○○路○○號">
      </div>
      <div class="field">
        <label>目的地名稱與地址<span class="req">*</span></label>
        <input type="text" id="toAddr" placeholder="例如：萬芳醫院 心臟內科">
      </div>
      <div class="field">
        <label>其他備註（選填）</label>
        <textarea id="otherNote" placeholder="希望條件、特殊需求等"></textarea>
      </div>
    </div>

    <button type="submit" class="submit-btn">送出需求</button>
    <div class="submit-error" id="submitError"></div>
    <div class="disclaimer">
      送出後會開啟 LINE 聊天室帶入摘要，平台人員將為您篩選並推薦 1–3 位陪送員。<br>
      試營運期間陪同服務免費，平台不會要求付款，也不代為收受或代墊金錢。
    </div>
  </form>
</div>

<script>
  // ↓↓↓ 正式上線時，把這裡換成你申請到的官方帳號 ID（要保留開頭的 @）
  const LINE_OA_ID = "@370cwhmh";

  // 從「瀏覽陪送員」按「預約這位陪送員」進來時，帶入指定的陪送員
  const wanted = new URLSearchParams(location.search).get("companion");
  if (wanted) {
    const note = document.getElementById("otherNote");
    if (!note.value) note.value = `希望由陪送員 ${wanted} 服務`;
    const banner = document.createElement("div");
    banner.className = "req-note";
    banner.style.cssText = "background:#E1EDEB;color:#2F6F6A;border-radius:10px;padding:10px 12px;margin:0 0 16px;font-weight:600;";
    banner.textContent = `您指定的陪送員：${wanted}（已填入「其他備註」，平台會優先安排）`;
    document.getElementById("requestForm").before(banner);
  }

  // 單選晶片的選取邏輯
  document.querySelectorAll(".radio-group").forEach(group => {
    group.querySelectorAll(".radio-chip").forEach(chip => {
      chip.addEventListener("click", () => {
        group.querySelectorAll(".radio-chip").forEach(c => c.classList.remove("selected"));
        chip.classList.add("selected");
      });
    });
  });

  function getSelected(groupName) {
    const group = document.querySelector(`.radio-group[data-group="${groupName}"]`);
    return group.querySelector(".selected").dataset.value;
  }

  // 不算空白的字數（中文、英數字都算一個字）
  const charCount = s => [...s.replace(/\s/g, "")].length;

  // 選項群組取選到的值，輸入框取文字
  const fieldValue = el => el.classList.contains("radio-group")
    ? (el.querySelector(".selected")?.dataset.value || "")
    : el.value.trim();

  // 必填欄位檢查：回傳錯誤訊息，沒問題回傳空字串（順序與頁面由上到下一致，才會捲到第一個錯誤）
  const RULES = [
    ["elderGender", v => v ? "" : "請選擇長輩的性別"],
    ["prefGender", v => v ? "" : "請選擇希望陪送員的性別"],
    ["emergencyPhone", v => {
      if (!v) return "請填寫緊急聯絡人電話";
      return v.replace(/\D/g, "").length < 8 ? "電話號碼好像不完整，請再確認一次" : "";
    }],
    ["serviceDate", v => {
      if (!v) return "請選擇服務日期";
      const today = new Date();
      const t = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}-${String(today.getDate()).padStart(2, "0")}`;
      return v < t ? "服務日期不能早於今天" : "";
    }],
    ["serviceTime", v => {
      if (!v) return "請選擇服務開始的時間";
      // 選今天的話，時間不能已經過了
      const now = new Date();
      const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
      const nowTime = `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;
      return document.getElementById("serviceDate").value === today && v < nowTime ? "這個時間已經過了，請選擇之後的時間" : "";
    }],
    ["fromAddr", v => {
      if (!v) return "請填寫出發地點（到府接送的地址）";
      return charCount(v) < 5 ? "請填寫完整的地址（包含路名與門牌號碼）" : "";
    }],
    // 目的地只要求 4 個字，「萬芳醫院」「台大醫院」這類名稱才不會被擋
    ["toAddr", v => {
      if (!v) return "請填寫目的地名稱與地址";
      return charCount(v) < 4 ? "請填寫完整的目的地名稱（例如：萬芳醫院 心臟內科）" : "";
    }],
  ];

  function showError(id, msg) {
    const field = document.getElementById(id).closest(".field");
    let el = field.querySelector(".err-msg");
    field.classList.toggle("error", !!msg);
    if (!msg) { if (el) el.remove(); return; }
    if (!el) { el = document.createElement("div"); el.className = "err-msg"; field.appendChild(el); }
    el.textContent = msg;
  }

  function validate() {
    let first = null, count = 0;
    for (const [id, check] of RULES) {
      const msg = check(fieldValue(document.getElementById(id)));
      showError(id, msg);
      if (msg) { count++; if (!first) first = id; }
    }
    const box = document.getElementById("submitError");
    box.style.display = count ? "block" : "none";
    box.textContent = count ? `還有 ${count} 個必填欄位需要確認，請看上方紅色提示` : "";
    if (first) {
      const el = document.getElementById(first);
      el.scrollIntoView({ behavior: "smooth", block: "center" });
      el.focus({ preventScroll: true });
    }
    return count === 0;
  }

  // 使用者修正後，即時拿掉該欄位的紅色提示
  RULES.forEach(([id, check]) => {
    const el = document.getElementById(id);
    ["input", "change", "click"].forEach(evt => el.addEventListener(evt, () => {
      if (el.closest(".field").classList.contains("error")) showError(id, check(fieldValue(el)));
    }));
  });

  document.getElementById("requestForm").addEventListener("submit", function (e) {
    e.preventDefault();
    if (!validate()) return;

    const mobility = getSelected("mobility");
    const dementia = getSelected("dementia");
    const serviceType = getSelected("serviceType");
    const duration = getSelected("duration");
    const date = document.getElementById("serviceDate").value || "未填";
    const time = document.getElementById("serviceTime").value || "未填";
    const from = document.getElementById("fromAddr").value || "未填";
    const to = document.getElementById("toAddr").value || "未填";
    const phone = document.getElementById("emergencyPhone").value || "未填";
    // 備註可能有換行，壓成一行才不會打亂摘要格式
    const oneLine = id => document.getElementById(id).value.trim().replace(/\s*\n+\s*/g, "；");
    const healthNote = oneLine("healthNote");
    const otherNote = oneLine("otherNote");

    const summary =
      `刊登需求：${serviceType}\n` +
      `日期時間：${date} ${time}（約 ${duration}）\n` +
      `出發：${from}\n目的地：${to}\n` +
      `長輩性別：${getSelected("elderGender")}，希望陪送員性別：${getSelected("prefGender")}\n` +
      `長輩行動能力：${mobility}，失智情形：${dementia}\n` +
      `緊急聯絡電話：${phone}` +
      (healthNote ? `\n健康狀況備註：${healthNote}` : "") +
      (otherNote ? `\n其他備註：${otherNote}` : "");

    const url = `https://line.me/R/oaMessage/${LINE_OA_ID}/?${encodeURIComponent(summary)}`;
    window.open(url, "_blank");
  });
</script>

</body>
</html>
